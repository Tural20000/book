<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Book Management</h1>
    </header>

    <main>
      <section id="auth-section" class="card">
        <div class="tabs">
          <button id="tab-register" class="tab active">Qeydiyyat</button>
          <button id="tab-login" class="tab">Daxil ol</button>
        </div>

        <form id="register-form" class="form active">
          <h2>Qeydiyyat</h2>
          <label>
            Username
            <input type="text" id="register-username" required />
          </label>
          <label>
            Password
            <input type="password" id="register-password" required />
          </label>
          <button type="submit">Qeydiyyat</button>
          <p class="form-message" id="register-message"></p>
        </form>

        <form id="login-form" class="form">
          <h2>Daxil ol</h2>
          <label>
            Username
            <input type="text" id="login-username" required />
          </label>
          <label>
            Password
            <input type="password" id="login-password" required />
          </label>
          <button type="submit">Daxil ol</button>
          <p class="form-message" id="login-message"></p>
        </form>
      </section>

      <section id="books-section" class="card hidden">
        <div class="books-header">
          <h2>Kitablar</h2>
          <div class="books-actions">
            <button id="open-create-modal-btn" class="secondary">Əlavə et</button>
            <button id="refresh-btn">Yenilə</button>
            <button id="logout-btn" class="secondary">Çıxış</button>
          </div>
        </div>

        <div class="books-search">
          <input type="text" id="book-search" placeholder="Ada görə axtar..." />
        </div>

        <div class="table-wrapper">
          <table id="books-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Müəllif</th>
                <th>Qiymət</th>
                <th>Say</th>
                <th>Əməliyyatlar</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <template id="book-row-template">
    <tr>
      <td class="cell-id"></td>
      <td class="cell-name"></td>
      <td class="cell-author"></td>
      <td class="cell-price"></td>
      <td class="cell-quantity"></td>
      <td class="cell-actions">
        <button class="edit-btn">Redaktə</button>
        <button class="delete-btn danger">Sil</button>
      </td>
    </tr>
  </template>
  
  <div id="book-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="book-modal-title">Kitab əlavə et</h3>
      <form id="book-form" class="form">
        <input type="hidden" id="book-id" />
        <label>
          Ad
          <input type="text" id="book-name" required />
        </label>
        <label>
          Müəllif
          <input type="text" id="book-author" required />
        </label>
        <label>
          Qiymət
          <input type="number" step="0.01" id="book-price" required />
        </label>
        <label>
          Say
          <input type="number" id="book-quantity" required />
        </label>
        <button type="submit" id="book-save-btn">Əlavə et</button>
        <button type="button" id="book-cancel-btn" class="secondary">Ləğv et</button>
        <p class="form-message" id="book-form-message"></p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
